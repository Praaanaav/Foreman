[project]
name = "Foreman"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "litellm",
  "pydantic>=2",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]